# The Site Configuration
theme: jekyll-theme-chirpy
lang: zh-TW
timezone: Asia/Hong_Kong

# 網站資訊
title: Trigo System Engineering Limited
tagline: 香港專業舞台燈光、視聽系統及工程解決方案 (Stage Lighting & AV Specialist)
description: >-
  Trigo System 提供專業的學校禮堂舞台燈光 (Stage Lighting)、視聽系統 (Audio Visual)、
  電子白板及 CCTV 中央廣播及音響工程服務。專注於香港教育界與商業機構的系統整合方案。
url: "https://www.trigosystem.com"

# -----------------------------------------------------------
# 🛑 側邊欄 (Sidebar) - 徹底留空
# -----------------------------------------------------------
# 我們故意留空，這樣它就不會嘗試顯示它看不懂的 IG，也不會報錯
contact:

# -----------------------------------------------------------
# 🛑 頁尾 (Footer) - 只留 IG
# -----------------------------------------------------------
social:
  name: Trigo System Engineering Limited
  # 注意：我把這裡的 email 也刪了，確保信封圖示 100% 消失
  links:
    - https://www.instagram.com/trigosys

# 其他核心設定
# Google / Bing 等站長工具驗證
webmaster_verifications:
  google: "dyaMH99rcbGFaZhUjj2gZzPzA7sJtplBtc4F80qm9Pw"
  bing:
  alexa:
  yandex:
  baidu:
  facebook:
theme_mode: light 
cdn:
avatar: /assets/img/trigo-logo.png
toc: true
comments:
  active: giscus
  giscus:
    repo: arthaskwok-dev/arthaskwok-dev.github.io
    repo_id: 'R_kgDOQ0ePCQ'
    category: General
    category_id: 'DIC_kwDOQ0ePCc4C0q-i'
    mapping: title
    strict: 1
    reactions_enabled: 1
    input_position: bottom
    lang: zh-TW
assets:
  self_host:
    enabled:
    env:
pwa:
  enabled: false
  cache:
    enabled: true
    deny_paths:
paginate: 10
baseurl: ""
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
sass:
  style: compressed
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - README.md
  - LICENSE
  - node_modules
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
